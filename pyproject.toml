[project]
name = "retrieval-eval-workbench"
version = "0.1.0"
description = "A local, reproducible retrieval and grounded-answer evaluation workbench."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Portfolio demo" }]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sentence-transformers>=3.4,<4",
  "scikit-learn>=1.6,<2",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "httpx>=0.28,<1"]

[project.scripts]
retrieval-workbench = "retrieval_eval_workbench.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retrieval_eval_workbench"]
